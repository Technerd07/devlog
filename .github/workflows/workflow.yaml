name: load-docker-images-to-kind
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  kind-image-loading-test:
    name: create cluster on kind
    runs-on: ubuntu-latest
    steps:
      - name: check repository
        uses: actions/checkout@v4
    #first build docker images
    #build the client image
      - name: build client and backend images
        run: |
          docker build --no-cache -f containerfiles/client/dockerfile -t docker-client-image:latest .
          docker build --no-cache -f containerfiles/backend/dockerfile -t docker-backend-image:latest .
      
