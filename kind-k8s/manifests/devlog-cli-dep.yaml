apiVersion: apps/v1
kind: Deployment
metadata:
  name: devlog-client
  labels:
    app: devlog-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devlog-client
  template:
    metadata:
      labels:
        app: devlog-client
    spec:
      containers:
        - name: devlog-client
          image: devlog-client-image:latest
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: "devlog-db-svc"
          command:
           #- sleep
           #- inf
           #Instead of executing the shell to make itself sleep inf ;
           #execute the command to run backend.sh as a background job process
          - bash 
          - backend.sh
          - "&"
          resources:
            requests:
              memory: "500Mi"
              cpu: "1"
            limits:
              cpu: "1"
              memory: "500Mi"
          volumeMounts:
            - name: devlog-client-pvc-claim
              mountPath: /mnt/backupdir
      volumes:
        - name: devlog-client-pvc-claim
          persistentVolumeClaim:
            claimName: devlog-client-pvc