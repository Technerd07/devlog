apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devlog-client-pvc
  labels:
    app: devlog-client 
spec:
  accessModes:
    - ReadWriteOnce # The volume can be mounted as read-write by a single node
  resources:
    requests:
      storage: 2Gi # Adjust storage size as needed (e.g., 10Gi, 20Gi)